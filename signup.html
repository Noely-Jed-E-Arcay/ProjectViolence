<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - SafeReport</title>

    <link rel="stylesheet" href="css/signup.css">

</head>

<body>

    <div class="signup-container">

        <!-- LEFT SIDE -->

        <div class="signup-left">

            <div class="shield">
                🛡️
            </div>

            <h1>
                SafeReport
            </h1>

            <p class="platform">
                Student Safety Platform
            </p>

            <p class="description">
                Join SafeReport and help create
                a safer school environment.
            </p>

        </div>


        <!-- RIGHT SIDE -->

        <div class="signup-right">

            <h2>
                Create Your Account
            </h2>

            <p class="subtitle">
                Create a new SafeReport student account
            </p>


            <form onsubmit="createAccount(event)">

                <label for="fullname">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="studentid">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentid"
                    name="studentid"
                    placeholder="Enter your student ID"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <label for="confirm">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm"
                    name="confirm"
                    placeholder="Confirm your password"
                    required
                >


                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                    >

                    <label for="terms">
                        I agree to the Terms and Conditions
                    </label>

                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <div class="login-section">

                <p>
                    Already have an account?
                </p>

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <!-- ONLY ONE AUTH JS -->
    <script src="JS/auth.js"></script>

</body>

</html>
