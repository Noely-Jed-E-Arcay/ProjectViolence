<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SafeReport</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-left">

            <div class="shield">
                🛡️
            </div>

            <h1>SafeReport</h1>

            <p class="platform">
                Student Safety Platform
            </p>

            <p class="description">
                Your voice matters. Report safety concerns
                securely and confidentially.
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-right">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to your SafeReport account
            </p>

            <form onsubmit="loginUser(event)">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <label for="remember">
                        Remember me
                    </label>

                </div>

                <button type="submit">
                    Login
                </button>

                <a
                    href="#"
                    class="forgot"
                    onclick="alert('Please contact the administrator to reset your password.'); return false;"
                >
                    Forgot Password?
                </a>

            </form>


            <div class="create-account">

                <h3>
                    Don't have an account?
                </h3>

                <p>
                    Create a new SafeReport account
                </p>

                <a href="signup.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <!-- ONLY ONE AUTH JS -->
    <script src="JS/auth.js"></script>

</body>

</html>
