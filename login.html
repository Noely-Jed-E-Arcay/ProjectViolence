<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SafeReport</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-left">

            <div class="shield">
                🛡️
            </div>

            <h1>SafeReport</h1>

            <p class="platform">
                Student Safety Platform
            </p>

            <p class="description">
                Your voice matters. Report safety concerns
                securely and confidentially.
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-right">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to your SafeReport account
            </p>

            <form onsubmit="handleUnifiedLogin(event)" id="loginForm">

                <div
                    id="loginError"
                    class="error-message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <div
                    id="loginSuccess"
                    class="success-message"
                    role="status"
                    aria-live="polite"
                ></div>
<label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <label for="remember">
                        Remember me
                    </label>

                </div>

                <button type="submit">
                    Login
                </button>

                <a
                    href="#"
                    class="forgot"
                    onclick="alert('Please contact the administrator to reset your password.'); return false;"
                >
                    Forgot Password?
                </a>

            </form>


            <div class="create-account">

                <h3>
                    Don't have an account?
                </h3>

                <p>
                    Create a new SafeReport account
                </p>

                <a href="signup.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <!-- Existing student authentication remains in tracel/auth.js.
         The unified handler below adds the embedded administrator account. -->
    <script src="tracel/auth.js"></script>

    <script>
    function handleUnifiedLogin(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const errorBox = document.getElementById("loginError");
        const successBox = document.getElementById("loginSuccess");

        errorBox.textContent = "";
        successBox.textContent = "";

        // Embedded administrator account. No separate admin login page is needed.
        const ADMIN_EMAIL = "admin@safereport.com";
        const ADMIN_PASSWORD = "Admin123!";

        if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
            sessionStorage.setItem("safeReportAdminLoggedIn", "true");
            sessionStorage.setItem("safeReportAdminEmail", ADMIN_EMAIL);
            successBox.textContent = "Administrator login successful. Opening reports...";

            window.setTimeout(function () {
                window.location.href = "admin-reports.html";
            }, 300);
            return;
        }

        // All other accounts use the existing student authentication.
        if (typeof loginUser === "function") {
            loginUser(event);
        } else {
            errorBox.textContent = "Student authentication is unavailable.";
        }
    }
    </script>

</body>

</html>
