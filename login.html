<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeReport | Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-page">
    <div class="login-shell">
        <section class="login-brand">
            <div class="login-brand-icon">🛡</div>
            <h1>SafeReport</h1>
            <p>Student Safety Platform</p>
            <br>
            <p>Your voice matters. Report safety concerns securely and confidentially.</p>
        </section>

        <section class="login-content">
            <h2>Welcome Back</h2>
            <p>Login to your account</p>

            <form class="login-form">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">

                <label class="checkbox">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>

                <button type="submit">Login</button>
            </form>

            <a class="login-link" href="#">Forgot Password?</a>

            <div class="signup-box">
                <h3>Don't have an account?</h3>
                <p>Create a new SafeReport account</p>
                <form class="login-form" style="margin-top:12px;">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name">

                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" placeholder="Enter your student ID">

                    <label for="create-email">Email Address</label>
                    <input type="email" id="create-email" placeholder="Enter your email">

                    <label for="create-password">Password</label>
                    <input type="password" id="create-password" placeholder="Create a password">

                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your password">

                    <button type="submit">Create Account</button>
                </form>
            </div>
        </section>
    </div>
</div>
<script src="JS/main.js"></script>
<script src="JS/SHARED/storage.js"></script>
<script src="JS/SHARED/validation.js"></script>
<script src="JS/SHARED/toast.js"></script>
<script src="JS/SHARED/navbar.js"></script>
<script src="JS/SHARED/modal.js"></script>
</body>
</html>
