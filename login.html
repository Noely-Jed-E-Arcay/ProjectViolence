<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SafeReport</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/page-transitions.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-left">

            <div class="shield">
                🛡️
            </div>

            <h1>SafeReport</h1>

            <p class="platform">
                Student Safety Platform
            </p>

            <p class="description">
                Your voice matters. Report safety concerns
                securely and confidentially.
            </p>

        </div>

        <!-- RIGHT SIDE -->
        <div class="login-right">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to your SafeReport account
            </p>

            <form id="loginForm">

                <div
                    id="loginError"
                    class="error-message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <div
                    id="loginSuccess"
                    class="success-message"
                    role="status"
                    aria-live="polite"
                ></div>

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <div class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <label for="remember">
                        Remember me
                    </label>

                </div>

                <button type="submit" id="loginButton">
                    Login
                </button>

                <a
                    href="#"
                    class="forgot"
                    onclick="alert('Please contact the administrator to reset your password.'); return false;"
                >
                    Forgot Password?
                </a>

            </form>

            <div class="create-account">

                <h3>
                    Don't have an account?
                </h3>

                <p>
                    Create a new SafeReport account
                </p>

                <a href="signup.html">
                    Create Account
                </a>

            </div>

            <p class="guest-return">
                <a href="guest.html">← Back to the welcome page</a>
            </p>

        </div>

    </div>

    <!-- EXISTING AUTHENTICATION -->
    <script src="tracel/auth.js"></script>
    <script src="JS/page-transitions.js"></script>

    <!-- LOGIN HANDLER -->
    <script>
    (function () {
        "use strict";

        const USERS_KEY = "safeReportUsers";
        const CURRENT_USER_KEY = "currentUser";
        const LEGACY_USER_KEY = "safeReportUser";
        const LOGIN_KEY = "safeReportLoggedIn";
        const DEMO_ADMIN = Object.freeze({
            fullName: "SafeReport Administrator",
            email: "admin@safereport.local",
            password: "SafeReportAdmin!2026",
            role: "Admin",
            localDemoAccount: true
        });

        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const errorBox = document.getElementById("loginError");
        const successBox = document.getElementById("loginSuccess");
        const loginButton = document.getElementById("loginButton");

        function normalizeEmail(email) {
            return String(email || "").trim().toLowerCase();
        }

        function showError(message) {
            errorBox.textContent = message;
            successBox.textContent = "";
        }

        function getStoredUsers() {
            let users = [];

            try {
                const storedUsers = localStorage.getItem(USERS_KEY);

                if (storedUsers) {
                    const parsedUsers = JSON.parse(storedUsers);

                    if (Array.isArray(parsedUsers)) {
                        users = parsedUsers;
                    }
                }
            } catch (error) {
                console.error(
                    "Unable to read registered accounts:",
                    error
                );

                throw new Error(
                    "Account information could not be loaded. Please try again."
                );
            }

            /*
             * Preserve compatibility with the older single-account
             * storage format without duplicating existing accounts.
             */
            try {
                const legacyAccount = localStorage.getItem(LEGACY_USER_KEY);

                if (legacyAccount) {
                    const parsedAccount = JSON.parse(legacyAccount);

                    if (
                        parsedAccount &&
                        typeof parsedAccount === "object" &&
                        parsedAccount.email
                    ) {
                        const alreadyExists = users.some(account =>
                            normalizeEmail(account.email) ===
                            normalizeEmail(parsedAccount.email)
                        );

                        if (!alreadyExists) {
                            users.push(parsedAccount);
                        }

                        localStorage.setItem(
                            USERS_KEY,
                            JSON.stringify(users)
                        );
                    }
                }
            } catch (error) {
                console.error(
                    "Unable to read the legacy account:",
                    error
                );
            }

            const existingDemoEmail = users.some(account =>
                normalizeEmail(account.email) ===
                normalizeEmail(DEMO_ADMIN.email)
            );

            if (!existingDemoEmail) {
                users.push({
                    ...DEMO_ADMIN,
                    dateCreated: new Date().toISOString()
                });

                try {
                    localStorage.setItem(
                        USERS_KEY,
                        JSON.stringify(users)
                    );
                } catch (error) {
                    console.error(
                        "Unable to save the local demo administrator account:",
                        error
                    );

                    throw new Error(
                        "The local administrator account could not be initialized. Please check browser storage and try again."
                    );
                }
            }

            return users;
        }

        function saveLoginSession(user, isAdmin) {
            /*
             * Preserve the account's existing fields and role.
             */
            localStorage.setItem(
                CURRENT_USER_KEY,
                JSON.stringify(user)
            );

            localStorage.setItem(
                LEGACY_USER_KEY,
                JSON.stringify(user)
            );

            localStorage.setItem(LOGIN_KEY, "true");

            if (isAdmin) {
                sessionStorage.setItem(
                    "safeReportAdminLoggedIn",
                    "true"
                );

                sessionStorage.setItem(
                    "safeReportAdminEmail",
                    normalizeEmail(user.email)
                );
            } else {
                sessionStorage.removeItem(
                    "safeReportAdminLoggedIn"
                );

                sessionStorage.removeItem(
                    "safeReportAdminEmail"
                );
            }
        }

        function handleLogin(event) {
            event.preventDefault();

            errorBox.textContent = "";
            successBox.textContent = "";

            const email = normalizeEmail(emailInput.value);
            const password = passwordInput.value;

            if (!email || !password) {
                showError("Please enter your email and password.");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const users = getStoredUsers();

                const matchedUser = users.find(account =>
                    normalizeEmail(account.email) === email &&
                    String(account.password || "") === password
                );

                if (!matchedUser) {
                    showError(
                        "Incorrect email or password, or no matching account exists."
                    );

                    return;
                }

                const role = String(matchedUser.role || "Student")
                    .trim()
                    .toLowerCase()
                    .replace(/\s+account$/i, "");

                const isAdmin =
                    role === "admin" ||
                    role === "administrator";

                /*
                 * Only accounts already marked as administrators
                 * in the stored account record use the admin route.
                 */
                saveLoginSession(matchedUser, isAdmin);

                successBox.textContent = isAdmin
                    ? "Administrator login successful. Opening dashboard..."
                    : "Login successful. Opening dashboard...";

                window.setTimeout(function () {
                    window.location.href = isAdmin
                        ? "admin-dashboard.html"
                        : "index.html";
                }, 300);

            } catch (error) {
                console.error("Login failed:", error);

                showError(
                    error.message ||
                    "Unable to log in. Please try again."
                );

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        }

        form.addEventListener("submit", handleLogin);

    })();
    </script>

</body>

</html>
